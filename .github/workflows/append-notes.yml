name: Append AI Interview Notes

on:
  push:
    paths:
      - "solutions/**/*.py"
      - "solutions/**/*.js"
      - "solutions/**/*.ts"
      - "solutions/**/*.go"
      - "solutions/**/*.java"
      - "solutions/**/*.cpp"
      - "solutions/**/*.c"
      - "solutions/**/*.rs"
      - "solutions/**/*.kt"
      - "solutions/**/*.swift"
      - "scripts/append-notes.py"  # 스크립트 자체 수정 시 백필
  workflow_dispatch:  # 수동 트리거 (Actions 탭에서 Run 가능)

permissions:
  contents: write

# 중복 실행 방지
concurrency:
  group: append-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  append-notes:
    runs-on: ubuntu-latest
    # 무한 루프 방지: 자기 자신이 만든 commit은 건너뜀
    if: "!contains(github.event.head_commit.message, '[skip notes]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run note appender
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/append-notes.py

      - name: Commit and push notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "🤖 Auto: append AI interview notes [skip notes]"
            git push
          else
            echo "No changes to commit"
          fi
